  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="movie-page-title">Movie Details - MovieTB</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    .player-container { width: 100%; max-width: 900px; margin: 0 auto 30px auto; background: #000; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .video-responsive { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .video-responsive iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
    .movie-info-card { max-width: 900px; margin: 0 auto; background: #1a1a1a; padding: 25px; border-radius: 12px; border: 1px solid #2a2a2a; }
    .movie-info-card h1 { font-size: 1.8rem; margin-bottom: 10px; color: #fff; }
    .movie-tags { display: flex; gap: 10px; margin-bottom: 20px; font-size: 0.9rem; color: #aaa; }
    .tag { background: #2a2a2a; padding: 4px 10px; border-radius: 4px; color: #e50914; font-weight: bold; }
    .info-grid { display: grid; grid-template-columns: 120px 1fr; gap: 12px; margin-bottom: 20px; font-size: 0.95rem; }
    .info-label { font-weight: bold; color: #888; }
    .info-value { color: #ddd; }
    .summary-box { background: #111; padding: 15px; border-radius: 8px; border-left: 4px solid #e50914; margin-top: 15px; color: #ccc; line-height: 1.6; }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo"><a href="index.html">Movie<span class="accent">TB</span></a></div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search movies...">
      <button id="search-btn">Search</button>
    </div>
  </header>

  <main class="container">
    <div id="movie-content-wrapper">
      <p class="loading">Loading movie details...</p>
    </div>
  </main>

  <footer>

  </footer>

  <script type="module" src="js/main.js"></script>
  <script type="module" src="js/movie-details.js"></script>
</body>
