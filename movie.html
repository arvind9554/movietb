  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="movie-page-title">Movie Details - MovieTB</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
  <style>
    /* ===== Player ===== */
    .player-container {
      width: 100%;
      max-width: 900px;
      margin: 30px auto 0 auto;
      background: #000;
      border-radius: 14px;
      overflow: hidden;
      box-shadow: 0 14px 40px rgba(0,0,0,0.75);
      border: 1px solid #262626;
    }
    .video-responsive { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; }
    .video-responsive iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }

    .video-responsive:fullscreen,
    .video-responsive:-webkit-full-screen,
    .video-responsive:-moz-full-screen {
      padding-bottom: 0; width: 100%; height: 100%;
    }
    .video-responsive:fullscreen iframe,
    .video-responsive:-webkit-full-screen iframe,
    .video-responsive:-moz-full-screen iframe {
      width: 100%; height: 100%;
    }
    .player-container:fullscreen,
    .player-container:-webkit-full-screen {
      max-width: 100%; border-radius: 0; box-shadow: none;
    }

    /* ===== Info Card ===== */
    .movie-info-card {
      max-width: 900px;
      margin: 24px auto 50px auto;
      background: linear-gradient(180deg, #181818 0%, #141414 100%);
      padding: 32px;
      border-radius: 14px;
      border: 1px solid #262626;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    .movie-info-card h1 {
      font-size: 1.9rem;
      line-height: 1.3;
      margin-bottom: 14px;
      color: #fff;
      font-weight: 800;
      letter-spacing: -0.3px;
    }

    .movie-tags {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin-bottom: 26px;
      padding-bottom: 24px;
      border-bottom: 1px solid #262626;
      font-size: 0.88rem;
      color: #999;
    }

    .tag {
      background: linear-gradient(135deg, #e50914, #b0060f);
      padding: 5px 14px;
      border-radius: 20px;
      color: #fff;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.3px;
      box-shadow: 0 2px 10px rgba(229,9,20,0.35);
    }

    .movie-tags .meta-dot {
      width: 4px;
      height: 4px;
      background: #555;
      border-radius: 50%;
      display: inline-block;
    }

    .info-grid {
      display: grid;
      grid-template-columns: 140px 1fr;
      row-gap: 16px;
      column-gap: 12px;
      margin-bottom: 22px;
      font-size: 0.95rem;
    }

    .info-label {
      font-weight: 700;
      color: #777;
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.6px;
      padding-top: 2px;
    }

    .info-value {
      color: #e8e8e8;
      line-height: 1.6;
      font-weight: 500;
    }

    .summary-box {
      background: #0f0f0f;
      padding: 20px;
      border-radius: 10px;
      border-left: 3px solid #e50914;
      margin-top: 18px;
      color: #c8c8c8;
      line-height: 1.8;
      font-size: 0.95rem;
    }

    .summary-box::before {
      content: "SYNOPSIS";
      display: block;
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 1px;
      color: #e50914;
      margin-bottom: 10px;
    }

    @media (max-width: 640px) {
      .movie-info-card { padding: 22px; border-radius: 12px; margin: 18px 12px 40px 12px; }
      .movie-info-card h1 { font-size: 1.4rem; }
      .info-grid { grid-template-columns: 1fr; row-gap: 12px; }
      .info-label { margin-bottom: -4px; }
      .player-container { margin-top: 18px; border-radius: 10px; }
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo"><a href="index.html">Movie<span class="accent">TB</span></a></div>
    <div class="search-box">
      <input type="text" id="search-input" placeholder="Search movies...">
      <button id="search-btn">Search</button>
    </div>
  </header>

  <main class="container">
    <div id="movie-content-wrapper">
      <p class="loading">Loading movie details...</p>
    </div>
  </main>

  </footer>

  <script type="module" src="js/movie-details.js"></script>
</body>
</html>
