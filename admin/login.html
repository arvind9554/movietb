<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - MovieTB</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body" data-admin-page="login">
  <div class="admin-login-page">
    <div class="admin-login-card">
      <h1>Movie<span class="accent">TB</span> Admin</h1>
      <p>Sign in to manage movies, trailers, and content.</p>
      <form id="login-form" class="admin-form" onsubmit="return false;">
        <div class="form-group" style="margin-bottom:14px;">
          <label for="admin-email">Email</label>
          <input type="email" id="admin-email" placeholder="admin@example.com" required autocomplete="username">
        </div>
        <div class="form-group" style="margin-bottom:20px;">
          <label for="admin-password">Password</label>
          <input type="password" id="admin-password" placeholder="Password" required autocomplete="current-password">
        </div>
        <button type="button" id="login-btn" class="admin-btn admin-btn-primary" style="width:100%;padding:12px;">Sign In</button>
      </form>
      <p style="margin-top:20px;text-align:center;">
        <a href="../index.html" style="color:#888;font-size:0.85rem;">← Back to MovieTB</a>
      </p>
    </div>
  </div>
  <div class="admin-toast-container" id="admin-toast-container" aria-live="polite"></div>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
