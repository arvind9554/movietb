<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login - MovieTB</title>
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .login-card { max-width: 400px; margin: 80px auto; padding: 20px; background: #1e1e1e; border-radius: 8px; }
    .login-card input { width: 100%; padding: 10px; margin: 10px 0; background: #2b2b2b; border: 1px solid #444; color: white; }
    .login-card button { width: 100%; padding: 10px; background: #e50914; color: white; border: none; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>
  <div class="login-card">
    <h2>Admin Login</h2>
    <input type="email" id="admin-email" placeholder="Admin Email">
    <input type="password" id="admin-password" placeholder="Password">
    <button id="login-btn">Login</button>
  </div>
  <script type="module" src="../js/admin.js"></script>
</body>
</html>
